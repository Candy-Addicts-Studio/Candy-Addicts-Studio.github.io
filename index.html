<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candy Addicts Studio | Mobile App Development</title>
    <link rel="icon" type="image/x-icon" href="icon.ico" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      h1,
      h2,
      .font-heading {
        font-family: "Outfit", sans-serif;
      }
      .bg-grid-pattern {
        background-size: 30px 30px;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px
          );
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white bg-grid-pattern relative overflow-x-hidden"
  >
    <!-- Navigation Bar -->
    <header
      class="w-full max-w-5xl mx-auto px-6 py-6 flex items-center justify-between"
    >
      <a
        href="#"
        class="flex items-center gap-2 font-heading font-black text-2xl tracking-tight hover:scale-105 transition-transform"
      >
        <span class="text-pink-500">
          <i data-lucide="lollipop" class="inline align-middle"></i>
          <span class="align-middle">Candy Addicts Studio</span>
        </span>
      </a>
      <a
        href="https://github.com/Candy-Addicts-Studio"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white px-4 py-2 rounded-full text-sm font-semibold transition-all"
      >
        <i data-lucide="building" class="w-4 h-4"></i>
        <span>GitHub</span>
      </a>
    </header>

    <!-- Main Hero Section -->
    <main
      class="w-full max-w-4xl mx-auto px-6 py-16 md:py-24 flex-grow flex flex-col items-center justify-center text-center"
    >
      <!-- Pill Badge -->
      <div
        class="inline-flex items-center gap-2 bg-pink-500/10 border border-pink-500/30 text-pink-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-8"
      >
        <span class="w-2 h-2 rounded-full bg-pink-500"></span>
        We Are Just Starting Out!
      </div>

      <!-- Main Headline -->
      <h1
        class="font-heading font-black text-5xl sm:text-6xl md:text-7xl leading-[1.1] tracking-tight mb-8"
      >
        We Build Stuff That<br class="hidden sm:inline" />
        <span class="text-pink-500"> You Might Actually Like. </span>
      </h1>

      <!-- Subheadline -->
      <p class="text-slate-400 text-lg md:text-xl max-w-2xl leading-relaxed">
        Do you want to try to build something fun with us?
      </p>
      <p
        class="text-slate-400 text-lg md:text-xl max-w-2xl leading-relaxed mb-12"
      >
        Reach us out through GitHub!
      </p>

      <!-- Call To Actions -->
      <div
        class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto"
      >
        <a
          href="https://github.com/Candy-Addicts-Studio"
          target="_blank"
          rel="noopener noreferrer"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-200 font-bold text-lg px-8 py-4 rounded-2xl transition-all"
        >
          <i data-lucide="building" class="w-5 h-5"></i>
          <span>Explore Our GitHub</span>
        </a>
      </div>
    </main>

    <!-- Simple Footer -->
    <footer
      class="w-full max-w-5xl mx-auto px-6 py-8 border-t border-slate-900 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500"
    >
      <p>© 2026 Candy Addicts Studio. All rights reserved.</p>
      <div class="flex items-center gap-6">
        <a
          href="https://github.com/Candy-Addicts-Studio"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-slate-300 transition-colors"
          >GitHub</a
        >
      </div>
    </footer>

    <!-- Initialize Lucide Icons -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
